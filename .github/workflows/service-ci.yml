name: Service CI

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build + test (unit + Testcontainers ITs)
        working-directory: ${{ inputs.service-name }}
        run: mvn -B verify

      - name: Upload OpenAPI spec
        if: hashFiles(format('{0}/target/openapi.json', inputs.service-name)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: openapi-${{ inputs.service-name }}
          path: ${{ inputs.service-name }}/target/openapi.json

      - name: Build Docker image
        run: docker build -t ghcr.io/stampede-io/${{ inputs.service-name }}:${{ github.sha }} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/stampede-io/${{ inputs.service-name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/stampede-io/${{ inputs.service-name }}:${{ github.sha }}
