name: Service CI

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build + test (unit + Testcontainers ITs)
        working-directory: ${{ inputs.service-name }}
        run: mvn -B verify

      - name: Upload OpenAPI spec
        if: hashFiles(format('{0}/target/openapi.json', inputs.service-name)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: openapi-${{ inputs.service-name }}
          path: ${{ inputs.service-name }}/target/openapi.json

      - name: Build Docker image
        run: docker build -t ghcr.io/stampede-io/${{ inputs.service-name }}:${{ github.sha }} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/stampede-io/${{ inputs.service-name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/stampede-io/${{ inputs.service-name }}:${{ github.sha }}

      - name: Check helm/Chart.yaml version matches pom.xml (STAM-51 AC8)
        working-directory: ${{ inputs.service-name }}
        run: |
          APP_VERSION=$(mvn -q -Dexpression=project.version -DforceStdout help:evaluate)
          CHART_VERSION=$(grep '^version:' ../helm/Chart.yaml | awk '{print $2}')
          CHART_APP_VERSION=$(grep '^appVersion:' ../helm/Chart.yaml | awk '{print $2}' | tr -d '"')
          echo "pom.xml project.version=$APP_VERSION | Chart.yaml version=$CHART_VERSION appVersion=$CHART_APP_VERSION"
          if [ "$APP_VERSION" != "$CHART_VERSION" ] || [ "$APP_VERSION" != "$CHART_APP_VERSION" ]; then
            echo "::error::helm/Chart.yaml's version/appVersion must match pom.xml's project.version, bumped in the same commit. pom=$APP_VERSION chart.version=$CHART_VERSION chart.appVersion=$CHART_APP_VERSION"
            exit 1
          fi

      - name: Set up Helm
        if: github.ref == 'refs/heads/main'
        uses: azure/setup-helm@v4

      - name: Package and push Helm chart to GHCR (STAM-51 AC1)
        if: github.ref == 'refs/heads/main'
        run: |
          helm package ${{ inputs.service-name }}/helm --destination /tmp/chart-out
          echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push /tmp/chart-out/${{ inputs.service-name }}-*.tgz oci://ghcr.io/stampede-io/charts
